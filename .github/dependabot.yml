# Dependabot version updates: monthly, one grouped PR per ecosystem (founder, 31 Oct 2026).
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/harness"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      all-updates:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      all-updates:
        patterns: ["*"]
